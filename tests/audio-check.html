<!doctype html><meta charset="utf-8"><base href="../"><title>Fivefold campaign audio checks</title><style>body{background:#12212a;color:#ddd2b9;font:14px monospace;padding:25px}button{padding:15px}pre{white-space:pre-wrap}</style><h1>Campaign audio validation</h1><button id="run">RUN AUDIO CHECKS</button><pre id="results">Ready</pre><script src="audio.js"></script><script>
document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#results'),Original=window.AudioContext,results=[];out.textContent='Rendering sound effects…';try{for(let el=0;el<8;el++){
const offline=new OfflineAudioContext(2,44100*7,44100);let clock=0;window.AudioContext=class{decodeAudioData(bytes){return offline.decodeAudioData(bytes)}get currentTime(){return clock}get sampleRate(){return offline.sampleRate}get state(){return 'running'}get destination(){return offline.destination}createGain(){return offline.createGain()}createDynamicsCompressor(){return offline.createDynamicsCompressor()}createConvolver(){return offline.createConvolver()}createBuffer(...a){return offline.createBuffer(...a)}createBufferSource(){return offline.createBufferSource()}createOscillator(){return offline.createOscillator()}createBiquadFilter(){return offline.createBiquadFilter()}createStereoPanner(){return offline.createStereoPanner()}};
const audio=new ElementAudio();audio.start();await audio.loadThunder();if(el===5)audio.setEnabled(false);if(el===6)audio.awaken();else for(let i=0;i<16;i++){clock=i*.25;audio.cast(el===7?2:el%5,true);}if(!audio.thunderBuffer)throw Error('Thunder sample did not decode');const rendered=await offline.startRendering(),data=rendered.getChannelData(0);let peak=0,sum=0,clips=0;for(const value of data){if(!Number.isFinite(value))throw Error('Nonfinite audio');peak=Math.max(peak,Math.abs(value));sum+=value*value;if(Math.abs(value)>=1)clips++;}const rms=Math.sqrt(sum/data.length);if(el!==5&&(rms<.001||clips))throw Error('Clipping or silence for '+el);if(el===5&&peak>0)throw Error('Mute failure');results.push({sound:['air','fire','lightning','water','earth','mute','orb awakening','repeated thunder'][el],peak:+peak.toFixed(4),rms:+rms.toFixed(4),clippedSamples:clips,scheduledVoices:audio.voices});}
window.AudioContext=Original;out.textContent='PASS — sampled thunder, repeated powers, awakening and mute.\n'+JSON.stringify(results,null,2);
}catch(e){out.textContent='FAIL '+e.stack;}finally{window.AudioContext=Original;}};
</script>
